name: Local checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install jsonschema==4.23.0
      - run: python3 -m unittest discover -s tests/unit -v
      - run: bash -n build-images.sh
  settings-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack yarn install --immutable
        working-directory: ui
      - run: corepack yarn lint --no-fix
        working-directory: ui
      - run: corepack yarn test:settings
        working-directory: ui
